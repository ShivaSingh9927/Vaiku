<svg
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bgGradient)" rx="40" />

  <!-- Logo Text -->
  <text
    x="600"
    y="560"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="120"
    font-weight="700"
    letter-spacing="6"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
  >
    NUERALOGIC
  </text>

  <!-- Tagline -->
  <text
    x="600"
    y="640"
    text-anchor="middle"
    fill="rgba(255,255,255,0.9)"
    font-size="32"
    font-weight="400"
    letter-spacing="1.5"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
  >
    Intelligent Solutions. Empowered Futures.
  </text>
</svg>
